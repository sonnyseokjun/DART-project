# DART 파이프라인 로그 회전 설정.
#
# 설치:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/dart
#   sudo logrotate -d /etc/logrotate.d/dart     # -d 는 시험 실행(파일을 건드리지 않는다)
#
# 왜 필요한가:
#   6단계 crontab에는 `find /var/log/dart -name '*.log' -mtime +30 -delete`가 있었으나
#   **동작하지 않는 줄이었다.** 계속 덧붙여지는 로그는 쓸 때마다 mtime이 갱신되므로
#   30일을 넘길 수가 없다. 멈춘 작업의 로그만 지워지고, 정작 커지는 파일은 영원히 남는다.
#
#   7단계에서 파이프라인이 평일 낮 1분마다 돌면 pipeline.log가 하루 1,000줄 넘게 쌓인다.
#   1GB 서버에 SSD 40GB라 당장 터지진 않지만, 방치하면 아무도 안 보는 사이 계속 는다.

/var/log/dart/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    su root root

    # copytruncate를 쓰는 이유: cron 작업들이 `>>`로 로그를 열어 둔 채 돈다.
    # 기본 방식(파일 이름 변경 후 새로 생성)을 쓰면 이미 열려 있는 파일 디스크립터가
    # 이름 바뀐 옛 파일을 계속 가리켜, 새 로그가 사라진 파일로 흘러들어간다.
    # copytruncate는 내용을 복사한 뒤 원본을 0바이트로 자르므로 디스크립터가 유효하다.
    #
    # 대가는 복사와 자르기 사이에 쓰인 몇 줄이 유실될 수 있다는 것이다. 회전은 주 1회
    # 새벽이고 잃는 것은 로그 몇 줄뿐이라 받아들인다.
    copytruncate
}
