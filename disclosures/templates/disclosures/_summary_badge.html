{% comment %} 요약이 없는 공시의 배지. 카드와 상세가 같은 문구를 쓰도록 한 곳에 둔다(이슈 #44). {% endcomment %}
{% with state=disclosure.summary_state %}
  {% if state == 'queued' %}
    <span class="badge badge-pending" title="AI 요약을 만들고 있습니다. 원문은 지금도 DART에서 볼 수 있습니다">
      AI가 정리 중
    </span>
  {% elif state == 'available' %}
    <span class="badge badge-pending">요약 전</span>
  {% elif state == 'failed' %}
    <span class="badge badge-pending">요약 실패</span>
  {% else %}
    <span class="badge badge-pending">단순 보고</span>
  {% endif %}
{% endwith %}
